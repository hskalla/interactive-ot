<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interactive OT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </script type="module" href="{{ url_for('static', filename='popup.js') }}">
    </script type="module" href="{{ url_for('static', filename='dynamic.js') }}">
    <script type="module">
        // Code inside here runs once the document is ready
        import { openPopup, closePopup, initializePopups } from "./static/popup.js";
        import { reloadAnalysis } from "./static/dynamic.js";

        $(document).ready(function(){
            window.constraints = ["NUC","*COMPLEX","MAX","DEP","ONS","*CODA"]

            initializePopups()
            reloadAnalysis()
        });
    </script>
</head>
<body class="body">
    <h1>Interactive Optimality Theory</h1>
    <div class="grid">
        <div class="grid_box">
            <p><b>Input: </b>{{ input }}</p>
        </div>
        <div class="grid_box"> {# empty div for formatting #} </div>
        <div class="grid_box">
            <table class="candidate_table">
                {# Candidate table contents are dynamically rendered. #}
            </table>
        </div>
        <div class="grid_box">
            <table class="constraint_table">
                {# Constraint table contents are dynamically rendered. #}
            </table>
        </div>
    </div>
</body>
</html>
